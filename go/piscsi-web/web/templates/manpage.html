{{define "manpage.html"}}
{{template "document-head" .}}
<body class="page-manpage">
{{template "page-header" .}}

    <div class="content">
        {{ if .App }}
        <h2>Manual for {{ .App }}({{ .Section }})</h2>
        {{ else }}
        <h2>Manual Page</h2>
        {{ end }}

        <div id="manpage-content">
        {{ .Manpage }}
        </div>

        <hr/>
    </div>

{{template "back-link" .}}
{{template "page-footer" .}}
</body>
</html>
{{end}}
