# PiSCSI Wi-Fi proxy-ARP profile. This file is inert until a DaynaPort is
# attached with mode=proxyarp. Set the NetworkManager-managed Wi-Fi interface
# that holds the Pi's LAN IPv4 address.
PISCSI_PROXYARP_UPLINK=wlan0

# Enable only for Wi-Fi drivers/APs that require promiscuous mode. PiSCSI
# restores the original flag only when it changed it itself.
PISCSI_PROXYARP_PROMISC=true
