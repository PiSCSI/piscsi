name: Docker Web Integration

on:
  push:
    branches:
      - develop
      - main
    paths:
      - '.github/workflows/web.yml'
      - 'docker/**'
      - 'go/**'
      - 'proto/**'
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/web.yml'
      - 'docker/**'
      - 'go/**'
      - 'proto/**'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker
    steps:
      - uses: actions/checkout@v7

      - name: Set Docker bind-mount identity
        run: |
          echo "PISCSI_DOCKER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "PISCSI_DOCKER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build and launch the web stack
        run: docker compose -f docker-compose.ci.yml up --build --detach

      - name: Run Go web tests
        run: docker compose -f docker-compose.ci.yml run --rm go-test

      - name: Output container logs
        if: success() || failure()
        run: |
          docker compose -f docker-compose.ci.yml logs web > web.log
          docker compose -f docker-compose.ci.yml logs -t | sort -u -k 3 > combined.log

      - name: Upload web log
        if: success() || failure()
        uses: actions/upload-artifact@v5
        with:
          name: web.log
          path: docker/web.log
