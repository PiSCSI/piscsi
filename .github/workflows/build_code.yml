name: Build ARM binaries

on:
  push:
    branches:
      - develop
      - main
    paths:
      - '.github/workflows/arm_cross_compile.yml'
      - '.github/workflows/build_code.yml'
      - 'cpp/**'
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/arm_cross_compile.yml'
      - '.github/workflows/build_code.yml'
      - 'cpp/**'

jobs:
  arm-build:
    uses: ./.github/workflows/arm_cross_compile.yml

  arm-debug:
    uses: ./.github/workflows/arm_cross_compile.yml
    with:
      debug-flag: true
