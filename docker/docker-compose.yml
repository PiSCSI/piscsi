services:
  backend:
    container_name: piscsi_backend
    image: piscsi-backend
    pull_policy: never
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    volumes:
      - ./volumes/images:/home/pi/images:delegated
      - ./volumes/config:/home/pi/.config/piscsi:delegated
    ports:
      - "127.0.0.1:${BACKEND_PORT:-6868}:6868"
    environment:
     - BACKEND_PASSWORD=${BACKEND_PASSWORD:-}
    init: true
    command: [
      "-L",
      "${BACKEND_LOG_LEVEL:-trace}",
    ]

  web:
    container_name: piscsi_web
    image: piscsi-web
    pull_policy: never
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
      args:
        - OS_VERSION=${OS_VERSION:-bullseye}
    volumes:
      - ./volumes/images:/home/pi/images:delegated
      - ./volumes/config:/home/pi/.config/piscsi:delegated
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8080}:8080"
    environment:
      PISCSI_HOST: ${BACKEND_HOST:-backend}
      PISCSI_PORT: ${BACKEND_PORT:-6868}
      PISCSI_TOKEN: ${BACKEND_PASSWORD:-}
      SERVER_PORT: 8080
      BASE_DIR: /home/pi/images
      SHARED_DIR: /home/pi/shared_files
      CONFIG_DIR: /home/pi/.config/piscsi
      SESSION_KEY: ${SESSION_KEY:-}
    user: "${PISCSI_DOCKER_UID:-1000}:${PISCSI_DOCKER_GID:-1000}"
    init: true
  go-test:
    container_name: piscsi_go_test
    image: piscsi-go-test
    pull_policy: never
    profiles:
      - webui-tests
    build:
      context: ..
      dockerfile: docker/go-test/Dockerfile
